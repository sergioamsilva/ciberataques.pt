[pytest]
# O projeto é escrito em português, incluindo os testes. Sem isto o pytest procura
# test_*.py e não encontra nada.
testpaths = testes
python_files = teste_*.py
python_functions = teste_*
addopts = -q --strict-markers
markers =
    rede: exige acesso à rede; excluído da execução normal com -m "not rede"
