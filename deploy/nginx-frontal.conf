# ciberataques.pt — vhost no PROXY FRONTAL (host "reverseproxy", público
# 185.95.221.12, LAN 192.168.200.154, SSH porta 1022).
# Instalado em /etc/nginx/conf.d/ciberataques-pt.conf.
#
# Termina o TLS e encaminha para o backend 192.168.200.151:8006 (deploy/nginx.conf).
# Esta é a forma ANTES do certificado. Com o DNS a apontar para 185.95.221.12:
#
#   sudo certbot --nginx --redirect -d ciberataques.pt -d www.ciberataques.pt
#
# O certbot acrescenta o bloco 443 e o redirecionamento; renovação pelo certbot.timer.
#
# Duas diferenças de propósito em relação aos vizinhos:
#   - access_log off. A política editorial (secção 11) promete que não registamos
#     endereços IP de quem nos lê, e este é o primeiro sítio onde o IP chega.
#   - não se encaminha o IP do visitante para o backend (sem X-Real-IP nem
#     X-Forwarded-For): o backend não precisa dele e não o deve ter.
#
# Os cabeçalhos de segurança vêm do backend. Não acrescentar aqui add_header com os
# mesmos nomes: duas CSP fazem o navegador aplicar a interseção e partem o site em
# silêncio.
server {
    server_name ciberataques.pt www.ciberataques.pt;
    listen 80;
    listen [::]:80;

    access_log off;

    location / {
        proxy_pass http://192.168.200.151:8006;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
