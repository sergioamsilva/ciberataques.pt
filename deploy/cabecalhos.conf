# Cabeçalhos de segurança do ciberataques.pt.
# Instalado em /etc/nginx/snippets/ciberataques-cabecalhos.conf; incluído em cada
# location de deploy/nginx.conf. NÃO usar o snippets/security-headers.conf partilhado
# do servidor: é mais largo do que este site precisa.
#
# Objetivo: A+ em securityheaders.com sem depender de nada externo. Sem analytics,
# sem formulários de terceiros, sem 'unsafe-inline' (o build não gera scripts nem
# estilos inline: assetsInlineLimit 0 em astro.config.mjs).
#
# 'wasm-unsafe-eval' é a única concessão, e é ao próprio site: o Pagefind usa
# WebAssembly para pesquisar no navegador. Sem isto a pesquisa falha em silêncio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
