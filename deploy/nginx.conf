# nginx para ciberataques.pt.
#
# Objetivo: A+ em securityheaders.com sem depender de nada externo.
# Base: siteCybers3c/deploy/nginx.conf, com a política mais apertada por não haver
# aqui formulários de terceiros nem analytics.

map $sent_http_content_type $csp {
    # 'wasm-unsafe-eval' é a única concessão, e é ao próprio site: o Pagefind usa
    # WebAssembly para pesquisar no navegador. Sem isto a pesquisa falha em silêncio.
    # Não abre a porta a scripts de terceiros: 'self' continua a ser a única origem.
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ciberataques.pt;

    root /var/www/ciberataques;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ciberataques.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciberataques.pt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Quem consulta um registo de ciberataques pode estar a investigar o seu próprio
    # empregador, o seu hospital ou a sua câmara. Essa consulta não deixa rasto aqui.
    access_log off;

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json application/rss+xml image/svg+xml application/wasm;
    gzip_min_length 512;

    # Identificadores estáveis que mudaram. Um identificador citado por um jornalista
    # nunca pode ficar a apontar para o vazio.
    include /var/www/ciberataques/redirecionamentos.map;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Ficheiros com hash no nome. Repetir os add_header é obrigatório: dentro de um
    # location, os do bloco pai deixam de ser herdados.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Dados abertos: reutilizáveis a partir de qualquer origem, por definição.
    location ~ ^/(dados|api)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name ciberataques.pt www.ciberataques.pt;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ciberataques.pt$request_uri; }
}

# Canónico sem www.
server {
    listen 443 ssl;
    http2 on;
    server_name www.ciberataques.pt;
    ssl_certificate     /etc/letsencrypt/live/ciberataques.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciberataques.pt/privkey.pem;
    return 301 https://ciberataques.pt$request_uri;
}
