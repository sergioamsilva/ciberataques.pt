# nginx para ciberataques.pt — vhost do BACKEND "sitesinternos" (192.168.200.151).
#
# Topologia, a mesma dos sites irmãos (diana.red, anciber.pt):
#
#   Internet → proxy frontal TLS 185.95.221.12 (192.168.200.154)  deploy/nginx-frontal.conf
#            → este backend, porta 8006, ficheiros em /var/www/ciberataques
#
# O TLS termina no frontal; aqui não há 80 nem 443. Os cabeçalhos de segurança são
# emitidos aqui e atravessam o frontal.
#
# Instalado em /etc/nginx/sites-available/ciberataques.pt (ligado em sites-enabled).
# Cabeçalhos em /etc/nginx/snippets/ciberataques-cabecalhos.conf (deploy/cabecalhos.conf).
# Fonte no repositório: editar aqui e voltar a copiar.

server {
    listen 8006;
    server_name ciberataques.pt www.ciberataques.pt;

    # Variável global deste servidor, definida no nginx.conf partilhado.
    if ($bad_user_agent) {
        return 403;
    }

    root /var/www/ciberataques;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # Quem consulta um registo de ciberataques pode estar a investigar o seu próprio
    # empregador, o seu hospital ou a sua câmara. Essa consulta não deixa rasto aqui
    # (política editorial, secção 11). O frontal tem a mesma regra.
    access_log off;

    # Sem isto, o redirecionamento de /incidentes para /incidentes/ sairia como
    # "Location: http://ciberataques.pt:8006/incidentes/": a porta do backend vaza e a
    # ligação fica inalcançável. O site usa barra final em todas as rotas.
    absolute_redirect off;
    port_in_redirect off;

    limit_req zone=general burst=20 nodelay;

    # Sem bloco types{} aqui, de propósito: neste nível ele SUBSTITUI os tipos
    # herdados do http{}, não os acrescenta, e CSS, PNG e SVG sairiam como
    # octet-stream (que, com nosniff, o navegador recusa). O mime.types do nginx
    # 1.24 já traz o application/wasm de que o Pagefind precisa.

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json application/rss+xml image/svg+xml application/wasm;
    gzip_min_length 512;

    # Identificadores estáveis que mudaram. Um identificador citado por um jornalista
    # nunca pode ficar a apontar para o vazio.
    #
    # Fica fora da raiz pública (o rsync --delete apagá-lo-ia a cada publicação, e
    # seria servido como ficheiro). O padrão com * não falha se ainda não existir
    # nenhum: um include de um ficheiro em falta impede o nginx de arrancar.
    # Modelo em deploy/redirecionamentos.conf.
    include /etc/nginx/snippets/ciberataques-redirecionamentos*.conf;

    # Canónico sem www. O frontal entrega os dois nomes aqui.
    if ($host = www.ciberataques.pt) {
        return 301 https://ciberataques.pt$request_uri;
    }

    # Os cabeçalhos vêm todos de um snippet incluído em cada location: um add_header
    # dentro de um location faz esquecer TODOS os do bloco pai, e foi assim que, na
    # versão anterior, os ficheiros de /_astro/ saíam sem HSTS nem Referrer-Policy.
    location / {
        include /etc/nginx/snippets/ciberataques-cabecalhos.conf;
        try_files $uri $uri/ =404;
    }

    # Ficheiros com hash no nome.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/ciberataques-cabecalhos.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /pagefind/ {
        include /etc/nginx/snippets/ciberataques-cabecalhos.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Dados abertos: reutilizáveis a partir de qualquer origem, por definição.
    location ^~ /dados/ {
        include /etc/nginx/snippets/ciberataques-cabecalhos.conf;
        # O mime.types do nginx 1.24 não conhece .csv, e as exportações saíam como
        # octet-stream. Um types{} num location substitui todos os tipos, por isso
        # listam-se os três que esta pasta tem.
        types {
            text/html        html;
            text/csv         csv;
            application/json json;
        }
        charset_types text/html text/csv application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/ciberataques-cabecalhos.conf;
        internal;
    }
}
