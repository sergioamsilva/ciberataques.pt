# Incidentes registados pelo CERT.PT, por ano.
#
# Isto NÃO são incidentes deste registo, e nunca pode ser somado a eles. É o
# denominador: o número oficial contra o qual a cobertura deste arquivo se torna
# mensurável.
#
# O projeto afirma, na metodologia, que conta incidentes NOTICIADOS e não
# incidentes OCORRIDOS. Sem um denominador isso é uma ressalva simpática que
# ninguém pode verificar. Com ele, passa a ser uma diferença que qualquer leitor
# vê: em 2024 o CERT.PT registou 2758 incidentes e este arquivo tem nove.
#
# O que o CERT.PT conta é diferente do que nós contamos, e a diferença tem de
# acompanhar sempre o número:
#
#   - O CERT.PT regista incidentes reportados por, ou detetados junto de,
#     entidades do ciberespaço de interesse nacional. Não os nomeia.
#   - Este arquivo regista incidentes tornados públicos com a entidade
#     identificada e com fonte citável.
#
# Um incidente pode estar num e não no outro por razões legítimas: a entidade
# reportou ao CERT.PT e nunca comunicou publicamente (está lá, não está cá), ou
# foi noticiado sem alguma vez ter sido reportado (está cá, não está lá).
#
# Cada valor é copiado à mão do relatório citado, com a linha onde aparece.
# Não há raspagem: o sítio do CNCS está atrás de um WAF (DiamWall) que devolve 513
# a qualquer cliente automático, incluindo um browser real conduzido por Playwright,
# e que bloqueia até o próprio robots.txt. Os relatórios de 2015 a 2023 vieram das
# cópias da Wayback Machine, que é onde este arquivo os vai buscar quando a origem
# não responde — a mesma regra que vale para as fontes dos incidentes.

fonte:
  nome: Observatório de Cibersegurança do CNCS
  serie: Relatório Cibersegurança em Portugal — Riscos & Conflitos
  url: https://www.cncs.gov.pt/pt/observatorio/
  nota: >-
    Os números são da Equipa de Resposta a Incidentes de Segurança Informática
    Nacional (CERT.PT), publicados anualmente pelo Observatório de Cibersegurança
    do Centro Nacional de Cibersegurança.

# ---------------------------------------------------------------- ressalvas da série

# Porque é que a série não começa quando o arquivo começa.
#
# Este registo documenta incidentes desde 2012. O denominador só existe a partir de
# maio de 2015, e não é lacuna nossa: é quando o CERT.PT começou a registar. Para
# 2012, 2013, 2014 e os primeiros quatro meses de 2015 não há número oficial contra
# o qual medir a nossa cobertura, e o site tem de o dizer em vez de deixar a célula
# vazia a parecer um zero.
inicio_da_serie:
  ano: 2015
  desde: maio
  nota: >-
    A série do CERT.PT começa em maio de 2015. Antes disso não há contagem oficial
    de incidentes em Portugal — o que não significa que não tenha havido incidentes,
    significa que ninguém os contava. O ano de 2015 é, por isso, parcial: os 248
    incidentes correspondem a oito meses e não a doze, e não se compara com 2016.

# A descontinuidade que torna a série enganadora se for lida como uma linha só.
#
# O CNCS chama-lhe, ele próprio, "quebra de série". Em 2020 a taxonomia do CERT.PT
# passou a contabilizar vulnerabilidades como incidentes. O salto de 754 (2019) para
# 1418 (2020) é, em parte, uma mudança de definição e não um aumento de ataques — o
# próprio relatório publica os dois valores para 2020 exatamente por isso: 1347 sem
# vulnerabilidades (+79%) e 1418 com (+88%).
#
# Um gráfico que ligue 2019 a 2020 com uma linha contínua está a afirmar um
# crescimento que a fonte não sustenta. Quem desenhar a série tem de partir a linha
# aqui.
quebra_de_serie:
  ano: 2020
  motivo: >-
    A partir de 2020 a taxonomia do CERT.PT passou a contabilizar as vulnerabilidades
    como incidentes (RNCSIRT, 2020). Os dados anteriores a 2020 não as incluem.
  citacao: >-
    "Quebra de série em 2020: devido a alterações na taxonomia utilizada pelo CERT.PT
    em 2020 (RNCSIRT, 2020), a partir desse ano passaram a ser contabilizadas as
    vulnerabilidades como incidentes. Os dados anteriores a 2020 não incluem as
    vulnerabilidades."
  edicao: Riscos & Conflitos 2023, nota da Tabela 1 e da Figura 2

# As percentagens de variação foram revistas entre edições, os valores absolutos não.
# A edição de 2021 dava +18% para 2017 e +16% para 2018; a de 2023 dá +21% e +20%
# para os mesmos anos, sobre os mesmos totais. Registam-se os da edição mais recente,
# que é a que o CNCS mantém.

anos:
  2015:
    incidentes: 248
    ano_parcial: true
    base_de_contagem: sem_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: >-
      Tabela 1: "2015 (desde maio) | 248 | N/A | out. (42)".
    nota: >-
      Oito meses e não doze: é o ano em que o CERT.PT começou a registar. Não se
      compara com nenhum outro ano da série.

  2016:
    incidentes: 413
    base_de_contagem: sem_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: 'Tabela 1: "2016 | 413 | N/A | fev. (56) | 1.º (135) | 1.º (243)".'
    nota: >-
      Primeiro ano civil completo da série. Sem variação declarada, porque o ano
      anterior é parcial.

  2017:
    incidentes: 501
    variacao_percentual: 21
    base_de_contagem: sem_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: 'Tabela 1: "2017 | 501 | +21 | mar. (57) | 4.º (143) | 2.º (255)".'

  2018:
    incidentes: 599
    variacao_percentual: 20
    base_de_contagem: sem_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: 'Tabela 1: "2018 | 599 | +20 | out. (68) | 2.º (169) | 1.º (301)".'

  2019:
    incidentes: 754
    variacao_percentual: 26
    base_de_contagem: sem_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: 'Tabela 1: "2019 | 754 | +26 | set. (79) | 3.º (213) | 2.º (412)".'
    nota: >-
      Último ano antes da quebra de série. É com este número, e não com o de 2020,
      que os anos anteriores se comparam.

  2020:
    incidentes: 1418
    incidentes_sem_vulnerabilidades: 1347
    variacao_percentual: 88
    variacao_percentual_sem_vulnerabilidades: 79
    base_de_contagem: com_vulnerabilidades
    quebra_de_serie: true
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: >-
      "Em 2020, o CERT.PT registou 1347 incidentes (sem contar com as
      vulnerabilidades), o que corresponde a um crescimento de 79% em relação a 2019.
      (…) Se as vulnerabilidades forem contabilizadas, o valor atinge os 1418 e o
      aumento corresponde a 88%."
    nota: >-
      O ano da mudança de taxonomia. Guarda-se 1418 como valor da série, que é o que
      o CNCS leva para os anos seguintes, e 1347 como o valor comparável com 2019.

  2021:
    incidentes: 1781
    variacao_percentual: 26
    base_de_contagem: com_vulnerabilidades
    edicao: Riscos & Conflitos 2023
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2023-obcibercncs.pdf
    citacao: 'Tabela 1: "2021 | 1781 | +26 | nov. (222) | 4.º (497) | 2.º (934)".'

  2022:
    incidentes: 2023
    variacao_percentual: 14
    base_de_contagem: com_vulnerabilidades
    edicao: Riscos & Conflitos 2024
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2024-obcibercncs.pdf
    citacao: 'Tabela 1: "2022 | 2023 | +14 | jan. (274) | 1.º (754) | 1.º (1239)".'
    nota: >-
      Os setores com mais incidentes foram a banca (19%, sobretudo clientes), as
      infraestruturas digitais (7%) e o ensino superior (7%).
    setores:
      origem: CERT.PT
      unidade: percentagem das atribuições setoriais do ano
      # A correspondência entre a tipologia do CERT.PT e a nossa fica escrita, e não
      # implícita, porque já esteve errada: em 2022 o "tecnologia" saía de
      # Infraestruturas Digitais e em 2023 saía de Prestadores de Serviços de
      # Internet — duas categorias diferentes da fonte com o mesmo destino aqui, o
      # que fazia a comparação entre anos medir coisas distintas. Agora cada valor
      # diz de onde vem.
      base_da_percentagem: atribuicoes_setoriais
      base_nota: >-
        As percentagens deste ano são calculadas sobre a soma das atribuições por
        setor (cerca de 2850), que é superior aos 2023 incidentes do ano porque um
        incidente pode contar em mais do que um setor. Em 2023 o CERT.PT passou a
        calculá-las sobre o total do ano, pelo que as percentagens dos dois anos NÃO
        se comparam entre si. Os números absolutos comparam-se.
      valores:
        banca_seguros: 19
        tecnologia: 7
        educacao_investigacao: 7
        telecomunicacoes: 5
        autarquias: 5
        transportes: 3
        saude: 3
      categorias_cert_pt:
        banca_seguros: {categoria: Banca, numero: 542, percentagem: 19}
        tecnologia: {categoria: Infraestruturas Digitais, numero: 205, percentagem: 7}
        educacao_investigacao:
          {categoria: "Educação e Ciência, Tecnologia e Ensino Superior", numero: 202, percentagem: 7}
        telecomunicacoes:
          {categoria: Prestadores de Serviços de Internet, numero: 148, percentagem: 5}
        autarquias: {categoria: Administração Pública Local, numero: 129, percentagem: 5}
        transportes: {categoria: Transportes, numero: 93, percentagem: 3}
        saude: {categoria: Saúde, numero: 83, percentagem: 3}
      nota: >-
        O CERT.PT avisa que o total por setor é superior ao total de incidentes,
        porque um incidente pode contar em mais do que um setor. As percentagens não
        somam cem.

  2023:
    incidentes: 2025
    variacao_percentual: 0.1
    base_de_contagem: com_vulnerabilidades
    edicao: Riscos & Conflitos 2024
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2024-obcibercncs.pdf
    citacao: 'Tabela 1: "2023 | 2025 | +0,1 | nov. (253) | 4.º (605) | 2.º (1080)".'
    nota: >-
      O ano em que a contagem oficial estabilizou. Os prestadores de serviços de
      internet passaram a ser o setor com mais incidentes registados (26%), à frente
      da banca (10%) e da saúde (8%), que mais do que duplicou.
    setores:
      origem: CERT.PT
      unidade: percentagem dos incidentes do ano
      base_da_percentagem: total_do_ano
      base_nota: >-
        Base diferente da de 2022: aqui as percentagens saem dos 2025 incidentes do
        ano, e em 2022 saíam da soma das atribuições setoriais (cerca de 2850). Uma
        subida de "3% para 8%" na saúde é, em parte, a base a encolher — os números
        absolutos, 83 para 171, é que dizem o que mudou.
      valores:
        telecomunicacoes: 26
        banca_seguros: 10
        saude: 8
        educacao_investigacao: 7
        tecnologia: 7
        transportes: 7
        autarquias: 5
      categorias_cert_pt:
        telecomunicacoes:
          categoria: Prestadores de Serviços de Internet
          numero: 517
          percentagem: 26
          nota: >-
            A subida de 249% não é toda um aumento de ataques: o CERT.PT escreve que
            "é explicado em parte por uma alteração metodológica numa das fontes de
            informação que passou a registar eventos deste tipo de uma forma mais
            sistemática". Dos incidentes deste setor, 66% são tentativas de
            autenticação.
        banca_seguros: {categoria: Banca, numero: 197, percentagem: 10}
        saude: {categoria: Saúde, numero: 171, percentagem: 8}
        educacao_investigacao:
          categoria: "Educação, Ciência, Tecnologia e Ensino Superior"
          # A mesma categoria de 2022, sem o "e" a seguir a Educação. Renomeada pelo
          # CERT.PT entre edições; declara-se para não ser lida como outra coisa.
          categoria_anterior: "Educação e Ciência, Tecnologia e Ensino Superior"
          numero: 150
          percentagem: 7
        tecnologia: {categoria: Infraestruturas Digitais, numero: 148, percentagem: 7}
        transportes: {categoria: Transportes, numero: 136, percentagem: 7}
        autarquias: {categoria: Administração Pública Local, numero: 111, percentagem: 5}
      nota: >-
        O CERT.PT avisa que um incidente pode contar em mais do que um setor, pelo
        que as percentagens não somam cem.

  2024:
    incidentes: 2758
    variacao_percentual: 36
    base_de_contagem: com_vulnerabilidades
    edicao: Riscos & Conflitos 2025
    url: https://www.cncs.gov.pt/docs/rel-riscosconflitos2025-obcibercncs15m.pdf
    citacao: >-
      "O número de incidentes registados pelo CERT.PT aumentou 36% em 2024
      atingindo os 2 758 incidentes."
    nota: >-
      Cerca de 78% ocorreram em entidades privadas. Subiram a energia e a
      administração pública local e regional; a banca caiu do 3.º para o 9.º lugar,
      com uma descida na ordem dos 69%.
    setores:
      # ATENÇÃO: estes valores NÃO são do CERT.PT. Para 2024 só existe arquivada a
      # versão resumida do relatório, que descreve os setores em palavras e não em
      # percentagens, e inventar números a partir de "subiram" seria exatamente o que
      # este projeto não faz. A versão integral não está na Wayback Machine e a
      # origem está atrás do WAF.
      #
      # O que há com números é a distribuição das notificações de violação de dados
      # à CNPD, que é outra coisa: mede o que as entidades comunicaram à autoridade
      # de proteção de dados, e não o que o CERT.PT registou. Fica com a origem à
      # vista, e o site apresenta-a como tal.
      origem: CNPD — notificações de violação de dados pessoais
      unidade: percentagem das notificações, separadas por setor público e privado
      valores:
        retalho: 33
        banca_seguros: 23
        saude: 9
        autarquias: 32
        administracao_publica: 27
        educacao_investigacao: 27
      nota: >-
        As percentagens do setor privado (comércio e serviços, banca e seguros,
        saúde) e as do público (administração local, administração central e
        institutos, ensino superior) são calculadas sobre universos separados e não
        somam cem entre si.

  2025:
    incidentes: 3864
    variacao_percentual: 40
    base_de_contagem: com_vulnerabilidades
    edicao: Riscos & Conflitos 2026
    url: https://www.publico.pt/2026/04/28/enter/noticia/incidentes-seguranca-informatica-portugal-aumentaram-40-2025-2172880
    citacao: >-
      O CERT.PT registou 3864 incidentes em 2025, um aumento de 40% face a 2024.
    nota: >-
      Maior subida da série. O valor foi noticiado a partir da apresentação pública
      do relatório, e não do PDF, que à data desta revisão não estava disponível no
      sítio do Observatório nem arquivado na Wayback Machine.
    # POR FAZER: trocar a ligação pelo PDF da edição de 2026 do Riscos & Conflitos
    # quando aparecer. Isto é manutenção e fica em comentário — as notas do ficheiro
    # vão para a página e são para o leitor, não para quem cura.
