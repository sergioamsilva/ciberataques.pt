# Crosswalk de organizações portuguesas.
#
# `chaves` são as formas por que a entidade aparece em notícias e reivindicações,
# já normalizadas (minúsculas, sem acentos, sem pontuação). São o que permite que
# procurar "MEO" encontre a Altice e "Continente" encontre a Sonae MC, tanto no
# agrupamento automático como na pesquisa do site.
#
# `sucessao` regista fusões e mudanças de nome, para que o histórico não se perca
# quando uma empresa muda de designação.

