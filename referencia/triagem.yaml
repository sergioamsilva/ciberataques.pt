# Vocabulário do processo penal.
#
# NUNCA é suficiente por si, e a distinção não é teórica: o feed da Polícia
# Judiciária traz todo o crime — tráfico de estupefacientes, incêndios, homicídios —
# e dos dez itens verificados nenhum era informático. Tratar "detido" ou "buscas"
# como marcador de ataque encheria a fila de apreensões de cocaína, e a fadiga de
# curadoria é o modo de falha mais provável deste projeto.
#
# Estes termos só somam pontuação quando há também um termo informático. Servem para
# distinguir uma notícia de crime informático de um artigo genérico sobre segurança.
processo_judicial:
  - arguido
  - arguidos
  - detido
  - detidos
  - detenção
  - prisão preventiva
  - acusação
  - acusados
  - condenado
  - condenados
  - buscas
  - inquérito
  - ministério público
  - polícia judiciária
  - dciap
  - unc3t
  - ulic
  - crime informático
  - cibercrime
