# Léxico da triagem determinística.
#
# Corta o corpus ANTES de gastar um único token de modelo de linguagem. Com ~700 itens
# recolhidos por dia e uma base de custo por item, a diferença entre triar aqui e triar
# no modelo é a diferença entre o projeto ser sustentável e não ser.
#
# É deliberadamente agressiva. O modo de falha mais provável deste projeto não é perder
# um incidente: é acumular candidatos por rever até a curadoria parar. Mais vale perder
# um caso, que uma segunda fonte acabará por trazer, do que ter duzentos por triar.

# Um item precisa de PELO MENOS UM termo desta lista.
ataque:
  - ciberataque
  - ciber-ataque
  - ataque informático
  - ataque informatico
  - ransomware
  - resgate informático
  - pirataria informática
  - piratas informáticos
  - hackers
  - hacker
  - violação de dados
  - fuga de dados
  - roubo de dados
  - dados roubados
  - dados expostos
  - acesso indevido
  - acesso ilegítimo
  - intrusão
  - exfiltração
  - phishing
  - malware
  - software malicioso
  - negação de serviço
  - ddos
  - cibersegurança
  - ciberataques
  - ciberataque
  - dark web
  - darkweb
  - site de extorsão
  - extorsão informática
  - sistemas informáticos em baixo
  - vítima de ataque

