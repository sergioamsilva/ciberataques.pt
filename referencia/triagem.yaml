  # Os nomes das infrações da Lei do Cibercrime (Lei 109/2009).
  #
  # São a linguagem em que estes casos aparecem quando chegam por via judicial, e o
  # léxico não conhecia nenhum: o ataque de 2024 ao SICO e ao PRVR do Ministério da
  # Saúde, com três detidos e acusação do Ministério Público, era invisível.
  #
  # Entram como fortes porque são inequivocamente computacionais — ao contrário do
  # vocabulário processual, que está em `processo_judicial` e nunca basta sozinho.
  - falsidade informática
  - sabotagem informática
  - acesso ilegítimo
  - dano informático
  - burla informática
  - interceção ilegítima
  - reprodução ilegítima de programa
  - devassa por meio de informática

# Os 308 concelhos de Portugal, menos um.
#
# Marcadores fracos de território. Existem porque a triagem conhecia nove nomes de
# lugares portugueses — Lisboa, Porto, Braga, Coimbra, Aveiro, Faro, Setúbal,
# Madeira e Açores — num registo que aspira a cobrir 308 municípios.
#
# A falha concreta: o título "Junta de São Salvador, em Ílhavo, foi alvo de ataque
# informático" não continha um único marcador português. Nem "junta de freguesia",
# que já lá está, porque o título dizia só "Junta de". Muitos feeds dão apenas
# título e uma descrição truncada, e com isso a notícia era invisível.
#
# São fracos e não fortes de propósito: muitos destes nomes existem no Brasil e
# noutros países lusófonos. Sozinhos não chegam — é preciso também um termo de
# ataque e a ausência de marcador estrangeiro.
#
# Falta Cuba, no distrito de Beja. É o único concelho cujo nome é também o de um
# país, e "ataque informático em Cuba" apanharia notícias de Havana. Fica de fora
# conscientemente: um falso positivo recorrente custa mais do que um concelho de
# quatro mil habitantes que se pode apanhar por outra via.
