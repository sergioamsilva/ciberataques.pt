# Correspondência entre os atores que este registo atribui e o MITRE ATT&CK.
#
# O que aqui está é UMA LIGAÇÃO, não uma caracterização técnica do incidente. Diz
# "este grupo está documentado pela MITRE, e é aqui" — e nada mais. Não afirma que
# o ataque a esta entidade usou as técnicas que a MITRE associa ao grupo.
#
# A distinção não é preciosismo. Ponderou-se atribuir técnicas ATT&CK a cada
# incidente, e a medição mostrou porque não se pode: em 83 incidentes, UM menciona
# phishing e DOIS nomeiam o vetor de entrada. Atribuir técnicas ao resto seria
# inferi-las, e um identificador como T1486 parece muito mais autoritário do que um
# palpite em prosa — é o mesmo erro que uma referência académica inventada, com
# melhor disfarce.
#
# Se algum dia uma fonte descrever a técnica de um incidente concreto, essa técnica
# entra na ficha desse incidente com o índice da fonte, como qualquer outro facto.
#
# `mitre: null` significa que foi procurado e não existe. É informação: a maior
# parte das marcas de ransomware que atingem municípios e PME portuguesas está
# abaixo do limiar de documentação da MITRE.

