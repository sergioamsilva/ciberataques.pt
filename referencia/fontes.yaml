# Catálogo declarativo das fontes de recolha.
#
# O alistamento é obrigatório: ingestao/rede.py recusa descarregar de qualquer domínio
# que não esteja aqui. Sem isto, bastava uma ligação num feed para nos pôr a raspar
# metade da internet.
#
# `intervalo_s` é o tempo mínimo entre pedidos ao mesmo servidor. Não é uma sugestão:
# é a diferença entre um agregador cívico e um incómodo.
#
# Estado dos feeds verificado a 2026-08-05. Ver referencia/NOTAS.md para as armadilhas.

fontes:
  # ---------------------------------------------------------------- comunicação social
  - id: eco
    nome: ECO
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [eco.sapo.pt]
    feeds:
      - https://eco.sapo.pt/feed/
    nota: O feed mais fiável da lista, com boa profundidade.

  - id: publico
    nome: Público
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [publico.pt, feeds.feedburner.com]
    feeds:
      - https://feeds.feedburner.com/PublicoRSS
      - https://feeds.feedburner.com/PublicoTecnologia
    nota: >-
      publico.pt/rss devolve 403 a acessos automatizados; usar o Feedburner. O sítio
      também bloqueia a leitura do corpo dos artigos, pelo que os excertos exigem
      verificação manual.

  - id: observador
    nome: Observador
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [observador.pt]
    feeds:
      - https://observador.pt/feed/
    nota: O feed principal traz poucos itens; complementar com pesquisa.

  - id: exame-informatica
    nome: Exame Informática
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [visao.pt]
    feeds:
      - https://visao.pt/exameinformatica/feed/

  - id: dinheiro-vivo
    nome: Dinheiro Vivo
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [dinheirovivo.pt]
    feeds:
      - https://www.dinheirovivo.pt/feed/

  - id: dn
    nome: Diário de Notícias
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [dn.pt]
    feeds:
      - https://www.dn.pt/feed/
    nota: dn.pt/rss devolve 404; o caminho correto é /feed/.

  - id: jornal-de-negocios
    nome: Jornal de Negócios
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [jornaldenegocios.pt]
    feeds:
      - https://www.jornaldenegocios.pt/rss
    codificacao: iso-8859-1
    nota: Declara ISO-8859-1. Ler como UTF-8 parte todos os acentos.

  - id: cm-jornal
    nome: Correio da Manhã
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [cmjornal.pt]
    feeds:
      - https://www.cmjornal.pt/rss
    codificacao: iso-8859-1

  - id: sabado
    nome: Sábado
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [sabado.pt]
    feeds:
      - https://www.sabado.pt/rss
    codificacao: iso-8859-1

  - id: rtp
    nome: RTP
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [rtp.pt]
    feeds:
      - https://www.rtp.pt/noticias/rss

  - id: noticias-ao-minuto
    nome: Notícias ao Minuto
    metodo: rss
    ativa: true
    intervalo_s: 3
    dominios: [noticiasaominuto.com]
    feeds:
      - https://www.noticiasaominuto.com/rss/tech

  - id: jn
    nome: Jornal de Notícias
    metodo: rss
    ativa: false
    intervalo_s: 3
    dominios: [jn.pt]
    feeds:
      - https://www.jn.pt/feed/
    nota: >-
      Desativado: entra em ciclo de redirecionamentos, provavelmente por exigir cookie
      de sessão. Reativar se aparecer um caminho de feed estável.

  - id: expresso
    nome: Expresso
    metodo: rss
    ativa: false
    intervalo_s: 3
    dominios: [feeds.feedburner.com]
    feeds:
      - https://feeds.feedburner.com/expresso-geral
    nota: >-
      Desativado: expresso.pt/rss devolve 403 e o feed do Feedburner traz um único
      item, o que o torna inútil para recolha diária.

  # ------------------------------------------------------- imprensa regional
  #
  # Acrescentada depois de uma falha concreta: o ciberataque ao município de Santa
  # Comba Dão, em junho de 2024, teve comunicado da própria câmara e cobertura numa
  # rádio regional, e não foi noticiado por nenhum órgão nacional. A recolha, que só
  # tinha títulos nacionais, era estruturalmente incapaz de o apanhar.
  #
  # Um registo que aspira a cobrir 308 municípios não pode depender de três jornais
  # de Lisboa. Estes cinco feeds não resolvem a lacuna — cobrem uma fatia do país —
  # mas mudam a natureza do problema, de cego para incompleto.
  #
  # Feeds verificados a 2026-08-05.
  - id: diario-de-coimbra
    nome: Diário de Coimbra
    metodo: rss
    ativa: true
    intervalo_s: 4
    # Redireciona para diariocoimbra.pt, sem a preposição. Ambos declarados: sem o
    # segundo, a camada de rede recusa o destino do redirecionamento, como deve.
    dominios: [diariodecoimbra.pt, diariocoimbra.pt]
    feeds:
      - https://www.diariodecoimbra.pt/feed/

  - id: diario-de-viseu
    nome: Diário de Viseu
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [diariodeviseu.pt, diarioviseu.pt]
    feeds:
      - https://www.diariodeviseu.pt/rss

  - id: jornal-do-centro
    nome: Jornal do Centro
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [jornaldocentro.pt]
    feeds:
      - https://www.jornaldocentro.pt/feed/

  - id: regiao-de-leiria
    nome: Região de Leiria
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [regiaodeleiria.pt]
    feeds:
      - https://www.regiaodeleiria.pt/feed/

  - id: noticias-de-aveiro
    nome: Notícias de Aveiro
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [noticiasdeaveiro.pt]
    feeds:
      - https://www.noticiasdeaveiro.pt/feed/

  - id: cidade-hoje
    nome: Cidade Hoje
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [cidadehoje.pt]
    feeds:
      - https://www.cidadehoje.pt/feed/

  # --------------------------------------------------------------------- leak sites
  - id: ransomware-live
    nome: ransomware.live
    metodo: api
    ativa: true
    intervalo_s: 65
    dominios: [api.ransomware.live, ransomware.live]
    endpoint: https://api.ransomware.live/v2/countryvictims/PT
    nota: >-
      Limite declarado de 1 pedido por minuto por endpoint; usamos 65 segundos por
      margem. O nível gratuito declara-se para uso pessoal: pedir a chave PRO gratuita
      antes de uso em produção. Nunca espelhar o conteúdo, nunca ligar a .onion, e
      citar sempre o tracker. Tudo o que daqui vem entra na fila como alegação do
      atacante e não pode ser promovido sem fonte independente.

  # ---------------------------------------------------------------------- arquivo
  - id: arquivo-pt
    nome: Arquivo.pt
    metodo: api
    ativa: true
    intervalo_s: 2
    dominios: [arquivo.pt]
    endpoint: https://arquivo.pt/wayback/cdx
    nota: >-
      Arquivo da web portuguesa, da FCCN. Preserva o domínio .pt desde 1996 e é a
      escolha natural para um registo português: já tem arquivadas quase todas as
      notícias que citamos, muitas vezes capturadas no próprio dia do incidente.
      Resolve dois problemas de uma vez — as ligações que morrem, e os sítios que
      nos recusam acesso direto, como o Público. Uso apenas de leitura: consultamos
      capturas existentes, não submetemos nada.

  - id: wayback-machine
    nome: Internet Archive
    metodo: api
    ativa: true
    intervalo_s: 3
    dominios: [web.archive.org, archive.org]
    endpoint: https://archive.org/wayback/available
    nota: >-
      Recurso secundário, para fontes estrangeiras que o Arquivo.pt não cobre.

  # ------------------------------------------------------------------ fase 2 e além
  - id: cncs
    nome: Centro Nacional de Cibersegurança
    metodo: navegador
    ativa: false
    intervalo_s: 10
    dominios: [cncs.gov.pt, dyn.cncs.gov.pt]
    nota: >-
      Desativado. Os feeds WordPress usados no iocRadar já não existem, e o portal
      está atrás de um WAF que devolve 307 em ciclo e 513 aos PDF. Exige Playwright.

  - id: cnpd
    nome: Comissão Nacional de Proteção de Dados
    metodo: html
    ativa: false
    intervalo_s: 10
    dominios: [cnpd.pt]
    nota: >-
      Desativado até haver parser. Sem RSS nem API: deliberações em PDF listadas em
      /decisoes/deliberacoes/. É a fonte de maior credibilidade do projeto, porque são
      factos confirmados por regulador, e a que exige mais cuidado.

  # -------------------------------------------- imprensa das regiões autónomas
  #
  # Acrescentada depois de um varrimento sistemático dos Açores e da Madeira que
  # revelou o óbvio: o registo tinha zero incidentes açorianos e um da Madeira, e
  # nenhuma fonte das duas regiões. O ciberataque ao maior hospital dos Açores em
  # 2021 e o ataque à Eletricidade dos Açores em 2022 só entraram no arquivo por
  # alguém perguntar, em agosto de 2026.
  #
  # As regiões autónomas não são um caso particular da imprensa regional do
  # continente: têm imprensa própria, governo próprio e serviços de saúde, energia
  # e transportes próprios, e nada disso aparece nos títulos de Lisboa a não ser
  # quando é muito grande.
  #
  # Feeds verificados a 2026-08-06. Ficam de fora, por não terem RSS utilizável, o
  # Açoriano Oriental (404 em todos os caminhos testados), o JM Madeira (redireciona
  # para um RSS que devolve HTML) e a RTP Madeira.
  - id: diario-dos-acores
    nome: Diário dos Açores
    metodo: rss
    ativa: true
    intervalo_s: 4
    # Sem o www: o domínio com www redireciona, e a camada de rede recusaria o
    # destino se ele não estivesse declarado.
    dominios: [diariodosacores.pt]
    feeds:
      - https://diariodosacores.pt/feed/

  - id: dnoticias
    nome: Diário de Notícias da Madeira
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [dnoticias.pt]
    feeds:
      - https://www.dnoticias.pt/rss.xml
    nota: >-
      /rss e /feed devolvem 404; o caminho correto é /rss.xml.

  - id: funchal-noticias
    nome: Funchal Notícias
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [funchalnoticias.net]
    feeds:
      - https://funchalnoticias.net/feed/

  # ------------------------------------------------------- fontes de autoridade
  #
  # A primeira fonte primária do catálogo. Tudo o resto é comunicação social a
  # relatar o que outros disseram; isto é a própria autoridade a dizê-lo.
  #
  # Acrescentada depois de o ataque de 2024 ao SICO e ao PRVR do Ministério da
  # Saúde nunca ter sido detetado. Esse caso trouxe três detidos em prisão
  # preventiva e acusação do Ministério Público, ou seja, a prova mais forte que
  # esta escala reconhece — e o registo era estruturalmente cego a ela.
  #
  # ATENÇÃO ao que este feed é: traz TODO o crime investigado pela PJ. Dos dez
  # itens verificados a 2026-08-06, nenhum era informático — vinham tráfico de
  # estupefacientes, incêndios e homicídios. É a triagem que o filtra, e é por isso
  # que o vocabulário processual em `processo_judicial` nunca basta sozinho.
  - id: policia-judiciaria
    nome: Polícia Judiciária
    metodo: rss
    ativa: true
    intervalo_s: 6
    tipo_fonte: regulador
    dominios: [policiajudiciaria.pt]
    feeds:
      - https://www.policiajudiciaria.pt/feed/
