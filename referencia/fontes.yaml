  # ------------------------------------------------------- fontes de autoridade
  #
  # A primeira fonte primária do catálogo. Tudo o resto é comunicação social a
  # relatar o que outros disseram; isto é a própria autoridade a dizê-lo.
  #
  # Acrescentada depois de o ataque de 2024 ao SICO e ao PRVR do Ministério da
  # Saúde nunca ter sido detetado. Esse caso trouxe três detidos em prisão
  # preventiva e acusação do Ministério Público, ou seja, a prova mais forte que
  # esta escala reconhece — e o registo era estruturalmente cego a ela.
  #
  # ATENÇÃO ao que este feed é: traz TODO o crime investigado pela PJ. Dos dez
  # itens verificados a 2026-08-06, nenhum era informático — vinham tráfico de
  # estupefacientes, incêndios e homicídios. É a triagem que o filtra, e é por isso
  # que o vocabulário processual em `processo_judicial` nunca basta sozinho.
  - id: policia-judiciaria
    nome: Polícia Judiciária
    metodo: rss
    ativa: true
    intervalo_s: 6
    tipo_fonte: regulador
    dominios: [policiajudiciaria.pt]
    feeds:
      - https://www.policiajudiciaria.pt/feed/

  # A jurisprudência dos tribunais superiores, pelo Conselho Superior da Magistratura.
  #
  # Entra desativada e declarada, que não é o mesmo que não existir: o domínio precisa
  # de estar aqui para a camada de rede o aceitar, e o que falta é o parser.
  #
  # É a alternativa ao DGSI, que está inacessível — e a comparação vale a pena porque
  # os dois falham de maneiras diferentes, apuradas a 2026-08-07:
  #
  #   O DGSI estabelece TLS em 0,03s, com o certificado a validar sem problema, e
  #   depois fica 25 segundos sem devolver um único byte. É a aplicação que não
  #   responde, não a rede.
  #
  #   O CSM respondia 200 e falhava na verificação do certificado, porque não envia o
  #   intermediário da Sectigo. Está resolvido na camada de rede, sem desligar a
  #   verificação: ver _remendar_cadeia() em ingestao/rede.py.
  #
  # Sobre o robots.txt: não tem grupo para `*`, pelo que o urllib.robotparser nos
  # autoriza. Mas bloqueia explicitamente o `ECLI-Downloader` e dá `Crawl-delay: 10` ao
  # Googlebot, e o sinal é claro — não querem descarregamento em massa. São perto de
  # 1,9 milhões de decisões em 762 sitemaps. Quando houver parser, será para consultar
  # à mão a partir de um caso concreto, nunca para varrer.
  - id: csm-jurisprudencia
    nome: Jurisprudência do Conselho Superior da Magistratura
    metodo: html
    tipo_fonte: regulador
    ativa: true
    intervalo_s: 10
    dominios: [jurisprudencia.csm.org.pt]
    nota: >-
      Ativa desde 2026-08-07, com parser em ingestao/fontes/csm.py. A pesquisa é por
      descritor e só funciona por GET — por POST o servidor responde 200 com a base
      inteira, ignorando o filtro em silêncio.

  # ------------------------------- órgãos que já nos deram casos e não eram fontes
  #
  # Acrescentados a 2026-08-07, depois de uma medição simples e incómoda: 49 das 246
  # fontes do registo — uma em cada cinco — vinham de domínios que não estavam no
  # catálogo. Ou seja, um quinto do que sabemos entrou por alguém tropeçar nele, e não
  # pela recolha.
  #
  # A Renascença é o caso mais claro: sete fontes no registo, órgão nacional, e nunca
  # esteve aqui. O feed correto não é /rss nem /feed, que respondem 200 com zero
  # itens — é /rssfeed-ultimas, declarado no <link rel="alternate"> da página.
  - id: renascenca
    nome: Renascença
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [rr.pt, rr.sapo.pt]
    feeds:
      - https://rr.pt/rssfeed-ultimas
    nota: >-
      /rss e /feed devolvem 200 com zero itens, o que é pior do que um 404 por não
      dar erro. O caminho certo vem do <link rel="alternate"> da página.

  - id: pplware
    nome: Pplware
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [pplware.sapo.pt]
    feeds:
