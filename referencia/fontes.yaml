  # --------------------------------------------------------------------- leak sites
  - id: ransomware-live
    nome: ransomware.live
    metodo: api
    ativa: true
    intervalo_s: 65
    dominios: [api.ransomware.live, ransomware.live]
    endpoint: https://api.ransomware.live/v2/countryvictims/PT
    nota: >-
      Limite declarado de 1 pedido por minuto por endpoint; usamos 65 segundos por
      margem. O nível gratuito declara-se para uso pessoal: pedir a chave PRO gratuita
      antes de uso em produção. Nunca espelhar o conteúdo, nunca ligar a .onion, e
      citar sempre o tracker. Tudo o que daqui vem entra na fila como alegação do
      atacante e não pode ser promovido sem fonte independente.

  # ---------------------------------------------------------------------- arquivo
  - id: arquivo-pt
    nome: Arquivo.pt
    metodo: api
    ativa: true
    intervalo_s: 2
    dominios: [arquivo.pt]
    endpoint: https://arquivo.pt/wayback/cdx
    nota: >-
      Arquivo da web portuguesa, da FCCN. Preserva o domínio .pt desde 1996 e é a
      escolha natural para um registo português: já tem arquivadas quase todas as
      notícias que citamos, muitas vezes capturadas no próprio dia do incidente.
      Resolve dois problemas de uma vez — as ligações que morrem, e os sítios que
      nos recusam acesso direto, como o Público. Uso apenas de leitura: consultamos
      capturas existentes, não submetemos nada.

  - id: wayback-machine
    nome: Internet Archive
    metodo: api
    ativa: true
    intervalo_s: 3
    dominios: [web.archive.org, archive.org]
    endpoint: https://archive.org/wayback/available
    nota: >-
      Recurso secundário, para fontes estrangeiras que o Arquivo.pt não cobre.

  # ------------------------------------------------------------------ fase 2 e além
  - id: cncs
    nome: Centro Nacional de Cibersegurança
    metodo: arquivo
    ativa: false
    intervalo_s: 10
    dominios: [cncs.gov.pt, dyn.cncs.gov.pt]
    nota: >-
      Desativado, e o Playwright não resolve — foi tentado a 2026-08-09 e a nota
      anterior, que o dava como solução, estava errada. O portal está atrás do WAF
      DiamWall, que responde 513 a um Chromium sem cabeça, 513 a um Chromium com
      user-agent e viewport reais, e 513 ao pedido direto dos PDF. Bloqueia inclusive
      o próprio robots.txt, o que significa que nem se consegue saber o que o sítio
      autoriza. Passar daqui exigiria falsificar a impressão digital do browser para
      derrotar o desafio do WAF, e isso este projeto não faz.
      O caminho que funciona é o arquivo: os relatórios Riscos & Conflitos de 2020 a
      2024 estão na Wayback Machine, em /content/files/ (edições antigas) e /docs/
      (recentes), e foi de lá que vieram os números de referencia/cncs.yaml. As
      edições de 2025 e 2026 ainda não estão arquivadas em versão integral.

  # A autoridade de proteção de dados. Segunda fonte primária do catálogo, depois da
  # Polícia Judiciária. Esteve desativada à espera de parser; passou a ativa a
  # 2026-08-07, com o parser em ingestao/fontes/cnpd.py.
  #
  # O que dá e o que não dá, apurado ao construí-lo:
  #
  #   O índice do histórico de decisões é bem estruturado e legível — número, emissor,
  #   assunto em uma linha e ligação. Mas os PDF das deliberações são DIGITALIZAÇÕES
  #   SEM CAMADA DE TEXTO: a deliberação 984/2018 tem vinte páginas de imagens JPX em
  #   7,7 MB, e o pdftotext extrai vinte bytes. Lemos o índice, e nunca os PDF.
  #
  #   E das trinta e três deliberações publicadas entre 2018 e 2026, quase nenhuma
  #   resulta de um ataque: são videovigilância, avaliações de impacto, protocolos
  #   entre entidades e comunicações não solicitadas. A CNPD é autoridade de proteção
  #   de dados, não de cibersegurança, e a maior parte do que sanciona não tem
  #   atacante nenhum.
  #
  #   Também não vê tudo o que a própria CNPD decide: a revisão da coima ao Centro
  #   Hospitalar Barreiro Montijo para 380 mil euros, em março de 2020, não consta da
  #   lista de deliberações publicadas.
  #
  # Fica ativa porque, quando uma violação de dados com origem em ataque É sancionada,
  # esta é a fonte primária e vale mais do que qualquer notícia sobre ela. Intervalo
  # largo: há poucas deliberações por ano e nada se ganha em olhar com frequência.
  - id: cnpd
    nome: Comissão Nacional de Proteção de Dados
    metodo: html
    tipo_fonte: regulador
    ativa: true
    intervalo_s: 10
    dominios: [cnpd.pt]
    nota: >-
      Não há robots.txt em cnpd.pt (404 verificado a 2026-08-07), pelo que não há
      restrições declaradas. Ainda assim a recolha é pouco frequente e identificada.

  # -------------------------------------------- imprensa das regiões autónomas
  #
  # Acrescentada depois de um varrimento sistemático dos Açores e da Madeira que
  # revelou o óbvio: o registo tinha zero incidentes açorianos e um da Madeira, e
  # nenhuma fonte das duas regiões. O ciberataque ao maior hospital dos Açores em
  # 2021 e o ataque à Eletricidade dos Açores em 2022 só entraram no arquivo por
  # alguém perguntar, em agosto de 2026.
  #
  # As regiões autónomas não são um caso particular da imprensa regional do
  # continente: têm imprensa própria, governo próprio e serviços de saúde, energia
  # e transportes próprios, e nada disso aparece nos títulos de Lisboa a não ser
  # quando é muito grande.
  #
  # Feeds verificados a 2026-08-06. Ficam de fora, por não terem RSS utilizável, o
  # Açoriano Oriental (404 em todos os caminhos testados), o JM Madeira (redireciona
  # para um RSS que devolve HTML) e a RTP Madeira.
  - id: diario-dos-acores
    nome: Diário dos Açores
    metodo: rss
    ativa: true
    intervalo_s: 4
    # Sem o www: o domínio com www redireciona, e a camada de rede recusaria o
    # destino se ele não estivesse declarado.
    dominios: [diariodosacores.pt]
    feeds:
      - https://diariodosacores.pt/feed/

  - id: dnoticias
    nome: Diário de Notícias da Madeira
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [dnoticias.pt]
    feeds:
      - https://www.dnoticias.pt/rss.xml
    nota: >-
      /rss e /feed devolvem 404; o caminho correto é /rss.xml.

  - id: funchal-noticias
    nome: Funchal Notícias
    metodo: rss
    ativa: true
    intervalo_s: 4
    dominios: [funchalnoticias.net]
    feeds:
