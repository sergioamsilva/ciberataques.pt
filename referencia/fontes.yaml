  # Acrescentada depois de uma falha concreta: o ciberataque ao município de Santa
  # Comba Dão, em junho de 2024, teve comunicado da própria câmara e cobertura numa
  # rádio regional, e não foi noticiado por nenhum órgão nacional. A recolha, que só
  # tinha títulos nacionais, era estruturalmente incapaz de o apanhar.
  #
  # Um registo que aspira a cobrir 308 municípios não pode depender de três jornais
  # de Lisboa. Estes cinco feeds não resolvem a lacuna — cobrem uma fatia do país —
  # mas mudam a natureza do problema, de cego para incompleto.
  #
  # Feeds verificados a 2026-08-05.
  - id: diario-de-coimbra
    nome: Diário de Coimbra
    metodo: rss
    ativa: true
    intervalo_s: 4
    # Redireciona para diariocoimbra.pt, sem a preposição. Ambos declarados: sem o
    # segundo, a camada de rede recusa o destino do redirecionamento, como deve.
    dominios: [diariodecoimbra.pt, diariocoimbra.pt]
    feeds:
