    nota: >-
      Seis fontes no registo antes de ser catalogado, incluindo o ataque de 2016 ao
      sistema de imagem do Hospital Garcia de Orta e o caso das plataformas clínicas
      do Estado. Cobre casos técnicos que a imprensa generalista ignora.

